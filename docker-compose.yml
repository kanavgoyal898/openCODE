services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opencode
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: opencode-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - opencode-postgres:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      OPENCODE_DATABASE_URL: postgresql+psycopg://opencode:opencode-local-only@postgres:5432/opencode
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      OPENCODE_DATABASE_URL: postgresql+psycopg://opencode:opencode-local-only@postgres:5432/opencode
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  opencode-postgres:
