[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-engine"
version = "0.1.0.dev0"
description = "Deterministic code fingerprinting and clone detection engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "openCODE contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter==0.26.1",
  "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = { "" = "packages/core/src" }

[tool.setuptools.packages.find]
where = ["packages/core/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/core/src", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["opencode_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
